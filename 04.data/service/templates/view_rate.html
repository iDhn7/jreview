<div class="card">
      <div class="card-title">긍·부정 리뷰 비율</div>
      <div class="sentiment-big">
        <div class="pie-wrap">
          <canvas id="pieChart" width="120" height="120" role="img" aria-label="긍정 78%, 부정 22% 도넛 차트"></canvas>
          <div class="pie-center">
            <div class="pie-pct" id="pie-pos-pct">78%</div>
            <div class="pie-sub">긍정</div>
          </div>
        </div>
        <div class="sentiment-legend">
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--pos);"></div>
            <div class="legend-label">긍정 리뷰</div>
            <div class="legend-val" id="legend-pos-val">968개 (78%)</div>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--neg);"></div>
            <div class="legend-label">부정 리뷰</div>
            <div class="legend-val" id="legend-neg-val">275개 (22%)</div>
          </div>
          <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);">
            <div style="font-size: 12px; color: var(--text-3);">분석 기간: 2025.01 ~ 2025.12</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 워드클라우드 (긍부정 비율과 같은 행) -->
    <div class="card">
      <div class="card-title">리뷰 워드클라우드</div>
      <div class="wordcloud-wrap" id="wordcloudWrap"></div>
    </div>
