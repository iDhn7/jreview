<div class="rag-wrap">
      <div class="rag-box" id="ragBox">

        <!-- 입력 행 -->
        <div class="rag-input-row">
          <span class="rag-input-icon">✦</span>
          <input class="rag-input" type="text" id="ragInput"
            placeholder="전주 한옥마을 근처 조용한 카페 추천해줘..."
            onkeydown="if(event.key==='Enter') ragSearch()">
          <button class="rag-submit" onclick="ragSearch()">
            <span>AI 검색</span>
            <span style="font-size:15px;">→</span>
          </button>
        </div>

        <!-- 추천 질문 chip -->
        <div class="rag-bottom-row">
          <span class="rag-ai-label">RAG AI</span>
          <div class="rag-chips">
            <span class="rag-chip" onclick="ragPreset(this)">주차 가능한 한식당은?</span>
            <span class="rag-chip" onclick="ragPreset(this)">리뷰 많은 카페 TOP3</span>
            <span class="rag-chip" onclick="ragPreset(this)">아이와 함께 가기 좋은 곳</span>
            <span class="rag-chip" onclick="ragPreset(this)">한옥마을 야경 맛집</span>
          </div>
        </div>

        <!-- AI 응답은 오버레이로 이동됨 -->

      </div>
    </div>
