<div class="card detail-full">
      <div class="card-title">업체 정보</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div style="font-size: 13px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; gap: 10px;">
            <span style="color: var(--text-3); width: 64px; flex-shrink: 0;">주소</span>
            <span style="color: var(--text-2);" id="biz-address">전북 전주시 완산구 전동 ○○길 12</span>
          </div>
          <div style="display: flex; gap: 10px;">
            <span style="color: var(--text-3); width: 64px; flex-shrink: 0;">영업시간</span>
            <span style="color: var(--text-2);">08:00 – 22:00 (연중무휴)</span>
          </div>
          <div style="display: flex; gap: 10px;">
            <span style="color: var(--text-3); width: 64px; flex-shrink: 0;">가격대</span>
            <span style="color: var(--text-2);">1만원 이하</span>
          </div>
          <div style="display: flex; gap: 10px;">
            <span style="color: var(--text-3); width: 64px; flex-shrink: 0;">주차</span>
            <span style="color: var(--neg); font-weight: 500;">불가 (인근 공용주차장 이용)</span>
          </div>
          <div style="display: flex; gap: 10px;">
            <span style="color: var(--text-3); width: 64px; flex-shrink: 0;">전화</span>
            <span style="color: var(--text-2);">063-000-0000</span>
          </div>

          <!-- 편의성 목록 -->
          <div style="display: flex; gap: 10px; align-items: flex-start;">
            <span style="color: var(--text-3); width: 64px; flex-shrink: 0; padding-top: 2px;">편의성</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              <!-- 주차: 중요 → 빨간색 굵게 강조 -->
              <span style="
                display: inline-flex; align-items: center; gap: 4px;
                background: #FEE2E2;
                border: 1.5px solid #FCA5A5;
                color: #B91C1C;
                font-weight: 700;
                font-size: 12px;
                padding: 4px 10px;
                border-radius: 100px;
              ">🅿️ 주차 불가</span>

              <!-- 무선인터넷 -->
              <span style="
                display: inline-flex; align-items: center; gap: 4px;
                background: var(--bg);
                border: 1px solid var(--border-2);
                color: var(--text-2);
                font-weight: 500;
                font-size: 12px;
                padding: 4px 10px;
                border-radius: 100px;
              ">📶 무선인터넷</span>

              <!-- 의자 -->
              <span style="
                display: inline-flex; align-items: center; gap: 4px;
                background: var(--bg);
                border: 1px solid var(--border-2);
                color: var(--text-2);
                font-weight: 500;
                font-size: 12px;
                padding: 4px 10px;
                border-radius: 100px;
              ">🪑 의자</span>
            </div>
          </div>
        </div>
        <div class="map-placeholder">
          <div class="map-icon">🗺️</div>
          <div class="map-address" id="map-address-display">전북 전주시 완산구 전동</div>
          <button class="map-open-btn">카카오맵에서 보기</button>
        </div>
      </div>
    </div>
