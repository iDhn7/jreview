{# 
  파일명: index_nav.html
  설명: 메인페이지 상단 네이게이션 블록
#}
<nav>
  <a class="nav-logo" onclick="resetToHome()">
    <span>전주</span>리뷰인사이트
    <span class="nav-badge">JTour</span>
  </a>
  <div class="nav-right">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <div class="nav-search-wrap" style="position:relative; display:flex; align-items:center;">
      <input
        id="navSearchInput"
        type="text"
        placeholder="업체명 또는 키워드 검색"
        style="
          background: var(--bg);
          border: none;
          border-bottom: 2px solid var(--primary);
          padding: 6px 12px 6px 10px;
          font-size: 13px;
          font-family: 'Noto Sans KR', sans-serif;
          font-weight: 700;
          color: var(--text);
          width: 210px;
          outline: none;
          transition: border-color .2s, width .3s;
          cursor: text;
        "
        onfocus="this.style.borderColor='var(--primary)'; this.style.width='260px';"
        onblur="this.style.borderColor='var(--primary)'; this.style.width='210px';"
        onkeydown="if(event.key==='Enter') navSearch(this.value)"
      >
      <button
        onclick="navSearch(document.getElementById('navSearchInput').value)"
        style="
          background: var(--primary);
          color: white;
          border: var(--primary);
          border-radius: 8px;
          padding: 6px 20px;
          font-size: 14px;
          font-weight: 700;
          font-family: 'Noto Sans KR', sans-serif;
          cursor: pointer;
          margin-left: 6px;
          white-space: nowrap;
          transition: background .15s;
        "
        onmouseover="this.style.background='var(--primary-dark)'"
        onmouseout="this.style.background='var(--primary)'"
      >검색</button>
    </div>
  </div>
</nav>
