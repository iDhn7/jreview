{# 
  파일명: rag.html
  설명: RAG 챗봇 오버레이 템플릿
#}
<div class="rag-overlay-backdrop" id="ragOverlayBackdrop" onclick="closeRagOverlay()"></div>
<div class="rag-overlay" id="ragOverlay">
  <div class="rag-ol-header">
    <div class="rag-ol-badge">AI 챗봇</div>
    <div class="rag-ol-query" style="font-weight:700;">RAG AI 어시스턴트</div>
    <button class="rag-ol-close" onclick="closeRagOverlay()">×</button>
  </div>
  <div class="rag-ol-body" id="ragOverlayBody">
    <!-- 채팅 내용이 동적으로 추가됨 -->
  </div>
  <div class="rag-ol-footer">
    <input type="text" id="ragOverlayInput" placeholder="추가로 궁금한 점을 물어보세요..." onkeydown="if(event.key==='Enter') sendRagOverlayMessage()">
    <button onclick="sendRagOverlayMessage()">전송</button>
  </div>
</div>
